<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEE BOT - Deriv Trading Bot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
body { background: #0f0f1a; color: #fff; padding: 20px; }
.container { max-width: 900px; margin: auto; }
h1 { text-align:center; color:#ff2d78; margin-bottom: 5px; }
.subtitle { text-align:center; color:#aaa; margin-bottom: 20px; }
.card { background:#1a1a2e; border-radius:12px; padding:20px; margin-bottom:20px; border:1px solid #2a2a4a; }
label { display:block; margin:10px 0 5px; color:#ccc; font-size:14px; }
input, select { width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#0f0f1a; color:#fff; font-size:14px; }
button { width:100%; padding:14px; border:none; border-radius:8px; background:#ff2d78; color:#fff; font-size:16px; font-weight:bold; cursor:pointer; margin-top:15px; }
button:hover { background:#ff4d8f; }
button:disabled { background:#555; cursor:not-allowed; }
#status { text-align:center; padding:10px; border-radius:8px; margin:10px 0; font-weight:bold; }
.connected { background:#0f5132; color:#75ffb0; }
.disconnected { background:#5c1a1a; color:#ff8a8a; }
#log { background:#000; padding:15px; border-radius:8px; height:250px; overflow-y:auto; font-family:monospace; font-size:12px; color:#0f0; white-space:pre-wrap; }
.price { font-size:28px; text-align:center; color:#00e5ff; margin:10px 0; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:600px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="container">
<h1>DEE BOT</h1>
<p class="subtitle">Deriv Trading Bot - Live Analysis</p>

<div class="card">
<label>App ID</label>
<input type="text" id="appId" value="353YmLl4HQoUW151xZbsE" placeholder="Enter App ID">
<label>API Token</label>
<input type="password" id="token" placeholder="Paste your Deriv API token">
<div class="grid">
<div>
<label>Symbol</label>
<select id="symbol">
<option value="R_100">Volatility 100 Index</option>
<option value="R_75">Volatility 75 Index</option>
<option value="R_50">Volatility 50 Index</option>
<option value="R_25">Volatility 25 Index</option>
<option value="R_10">Volatility 10 Index</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
</select>
</div>
<div>
<label>Stake ($)</label>
<input type="number" id="stake" value="1" step="0.1" min="0.35">
</div>
</div>
<button id="connectBtn" onclick="connect()">CONNECT & START ANALYSIS</button>
<div id="status" class="disconnected">● Disconnected</div>
<div class="price" id="price">--</div>
</div>

<div class="card">
<label>Live Log</label>
<div id="log">Waiting to connect...\n</div>
</div>
</div>

<script>
let ws = null;
let isConnected = false;

function log(msg){
  const el = document.getElementById('log');
  const time = new Date().toLocaleTimeString();
  el.textContent += `[${time}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
  console.log(msg);
}

function setStatus(connected, text){
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = connected ? 'connected' : 'disconnected';
  document.getElementById('connectBtn').disabled = connected;
}

function connect(){
  const appId = document.getElementById('appId').value.trim();
  const token = document.getElementById('token').value.trim();
  const symbol = document.getElementById('symbol').value;

  if(!appId){ log('❌ Please enter App ID'); return; }
  if(!token){ log('❌ Please enter API Token'); return; }

  log(`Connecting to Deriv with App ID: ${appId}`);
  setStatus(false, '● Connecting...');

  // FIXED: Using binaryws endpoint to avoid 520 error
  ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${appId}`);

  ws.onopen = () => {
    log('✅ WebSocket connected! Authorizing...');
    ws.send(JSON.stringify({ authorize: token }));
  };

  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);

    if(data.error){
      log(`❌ Error: ${data.error.message} (code: ${data.error.code})`);
      setStatus(false, '● Error - Check Token');
      return;
    }

    if(data.msg_type === 'authorize'){
      log(`✅ Authorized! Account: ${data.authorize.loginid} | Balance: ${data.authorize.balance} ${data.authorize.currency}`);
      setStatus(true, '● Connected - Live');
      isConnected = true;
      // Subscribe to ticks
      ws.send(JSON.stringify({ ticks: symbol, subscribe: 1 }));
      log(`📈 Subscribed to ${symbol}`);
    }

    if(data.msg_type === 'tick'){
      const price = data.tick.quote;
      document.getElementById('price').textContent = price;
      log(`💹 ${symbol}: ${price}`);
    }
  };

  ws.onerror = (e) => {
    log('❌ Connection error - check internet / App ID');
    console.error('WebSocket error:', e);
    setStatus(false, '● Connection Error');
  };

  ws.onclose = (e) => {
    log(`⚠️ Connection closed (code: ${e.code})`);
    setStatus(false, '● Disconnected');
    isConnected = false;
  };
}

// Auto-fill saved token if exists
window.onload = () => {
  const savedToken = localStorage.getItem('dee_token');
  if(savedToken) document.getElementById('token').value = savedToken;
  const savedApp = localStorage.getItem('dee_appid');
  if(savedApp) document.getElementById('appId').value = savedApp;
};

// Save on input
document.getElementById('token').addEventListener('input', (e)=>{
  localStorage.setItem('dee_token', e.target.value);
});
document.getElementById('appId').addEventListener('input', (e)=>{
  localStorage.setItem('dee_appid', e.target.value);
});
</script>
</body>
</html>
