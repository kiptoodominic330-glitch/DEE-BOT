<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEE BOT</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;max-width:600px;margin:auto}
h1{color:#00ff88;text-align:center}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;font-size:16px;box-sizing:border-box}
input{background:#222;color:#fff}
button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer}
button:disabled{background:#555}
#price{font-size:48px;text-align:center;margin:20px 0;color:#00ff88}
#log{background:#111;padding:10px;height:220px;overflow:auto;font-size:13px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h1>DEE BOT</h1>
<input id="appId" placeholder="App ID" value="353YmLl4HQoUW151xZbsE">
<input id="token" placeholder="Paste Token" type="password">
<button id="connectBtn" onclick="connect()">CONNECT</button>
<button onclick="disconnect()" style="background:#ff4444;color:#fff">DISCONNECT</button>
<div id="price">--</div>
<div id="log">Ready. Click CONNECT.</div>

<script>
let ws=null;
let endpoints=[
  "wss://ws.derivws.com/websockets/v3?app_id=",
  "wss://ws.binaryws.com/websockets/v3?app_id=",
  "wss://ws.derivws.com/websockets/v3?app_id="
];
let currentEndpoint=0;

function log(msg){ 
  const el=document.getElementById('log');
  el.textContent += "\n"+new Date().toLocaleTimeString()+" - "+msg;
  el.scrollTop=el.scrollHeight;
  console.log(msg);
}

function connect(){
  const appId=document.getElementById('appId').value.trim();
  const token=document.getElementById('token').value.trim();
  if(!appId||!token){ log("Enter App ID and Token"); return; }
  localStorage.setItem('dee_appId',appId);
  localStorage.setItem('dee_token',token);
  currentEndpoint=0;
  tryConnect(appId,token);
}

function tryConnect(appId,token){
  if(ws){ try{ws.close()}catch(e){} }
  const url=endpoints[currentEndpoint]+appId;
  log("Trying endpoint "+(currentEndpoint+1)+": "+url);
  document.getElementById('connectBtn').disabled=true;
  ws=new WebSocket(url);
  
  ws.onopen=()=>{
    log("Connected to endpoint "+(currentEndpoint+1));
    ws.send(JSON.stringify({authorize:token}));
  };
  ws.onmessage=(e)=>{
    const data=JSON.parse(e.data);
    if(data.msg_type==='authorize'){
      if(data.error){ log("Auth error: "+data.error.message); return; }
      log("Authorized: "+data.authorize.loginid);
      ws.send(JSON.stringify({ticks:"R_100",subscribe:1}));
    }
    if(data.msg_type==='tick'){
      document.getElementById('price').textContent=data.tick.quote;
    }
    if(data.error){ log("Error: "+data.error.message); }
  };
  ws.onerror=()=>{
    log("WebSocket error on endpoint "+(currentEndpoint+1));
  };
  ws.onclose=(e)=>{
    log("Closed (code "+e.code+") on endpoint "+(currentEndpoint+1));
    document.getElementById('connectBtn').disabled=false;
    if(currentEndpoint < endpoints.length-1){
      currentEndpoint++;
      log("Trying next endpoint...");
      setTimeout(()=>tryConnect(appId,token),1000);
    } else {
      log("All endpoints failed. Try VPN or wait 10 mins.");
    }
  };
}

function disconnect(){
  if(ws) ws.close();
  log("Disconnected");
  document.getElementById('connectBtn').disabled=false;
}

window.onload=()=>{
  const savedApp=localStorage.getItem('dee_appId');
  const savedToken=localStorage.getItem('dee_token');
  if(savedApp) document.getElementById('appId').value=savedApp;
  if(savedToken) document.getElementById('token').value=savedToken;
  if(savedApp && savedToken) log("Loaded saved App ID & Token. Click CONNECT.");
};
</script>
</body>
</html>
